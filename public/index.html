<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>포켓몬 스플랜더 (Pokémon Splendor)</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- 대기실 화면 -->
  <div id="lobby">
    <h1>⚡ 포켓몬 스플랜더</h1>
    
    <div class="lobby-box">
      <input type="text" id="playerName" placeholder="플레이어 이름 입력">
      <button id="btnJoin">참가하기</button>
      <button id="btnStart" style="display:none;">게임 시작</button>
    </div>

    <!-- 💡 대기실 유저 현황 리스트 추가 -->
    <div id="lobby-players-container">
      <h3>대기실 현황 (<span id="lobby-count">0</span> / 4)</h3>
      <div id="lobby-players-list">
        <div class="lobby-empty">입장한 플레이어가 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- 메인 게임 화면 -->
  <div id="game-container" style="display:none;">
    <!-- 상단 턴 안내 헤더 -->
    <header class="top-header">
      <div class="logo">⚡ POKÉMON SPLENDOR</div>
      <div class="turn-indicator">
        <span>현재 턴:</span>
        <img id="current-turn-avatar" src="" class="avatar-small" alt="">
        <span id="current-turn-player" class="turn-name">-</span>
      </div>
    </header>

    <!-- 가로 3단 메인 영역 -->
    <div class="dashboard-layout">
      
      <!-- 1. 좌측: 토큰 창고 -->
      <aside class="sidebar-tokens">
        <div class="panel-title">볼 토큰 창고</div>
        <div class="token-grid">
          <button data-color="monster" class="token-btn">
            <img src="/images/monster.png" alt="몬스터볼">
            <span id="bank-monster" class="token-count">0</span>
            <span id="select-monster" class="select-badge" style="display:none;">0</span>
          </button>
          <button data-color="super" class="token-btn">
            <img src="/images/super.png" alt="슈퍼볼">
            <span id="bank-super" class="token-count">0</span>
            <span id="select-super" class="select-badge" style="display:none;">0</span>
          </button>
          <button data-color="hyper" class="token-btn">
            <img src="/images/hyper.png" alt="하이퍼볼">
            <span id="bank-hyper" class="token-count">0</span>
            <span id="select-hyper" class="select-badge" style="display:none;">0</span>
          </button>
          <button data-color="heal" class="token-btn">
            <img src="/images/heal.png" alt="힐볼">
            <span id="bank-heal" class="token-count">0</span>
            <span id="select-heal" class="select-badge" style="display:none;">0</span>
          </button>
          <button data-color="quick" class="token-btn">
            <img src="/images/quick.png" alt="퀵볼">
            <span id="bank-quick" class="token-count">0</span>
            <span id="select-quick" class="select-badge" style="display:none;">0</span>
          </button>
          <div class="token-btn disabled">
            <img src="/images/master.png" alt="마스터볼">
            <span id="bank-master" class="token-count">0</span>
          </div>
        </div>

        <button id="btnConfirmTokens" class="action-btn">선택한 토큰 가져오기</button>
        <button id="btnResetTokens" class="action-btn-secondary">선택 초기화</button>
      </aside>

      <!-- 2. 중앙: 포켓몬 마켓 진열대 -->
      <main class="market-section">
        <div class="market-row-container special-row-container">
          <div class="special-slot">
            <div class="row-label legendary">전설</div>
            <div id="cards-legendary" class="card-row"></div>
          </div>
          <div class="special-slot">
            <div class="row-label rare">희귀</div>
            <div id="cards-rare" class="card-row"></div>
          </div>
        </div>

        <div class="market-row-container">
          <div class="row-label lvl3">3단계</div>
          <div id="cards-level3" class="card-row"></div>
        </div>

        <div class="market-row-container">
          <div class="row-label lvl2">2단계</div>
          <div id="cards-level2" class="card-row"></div>
        </div>

        <div class="market-row-container">
          <div class="row-label lvl1">1단계</div>
          <div id="cards-level1" class="card-row"></div>
        </div>
      </main>

      <!-- 3. 우측: 플레이어 현황 패널 -->
      <aside class="sidebar-players">
        <div class="panel-title">플레이어 현황</div>
        <div id="players-list"></div>
      </aside>

    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
